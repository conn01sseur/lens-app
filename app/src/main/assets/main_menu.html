<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Главное меню</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: system-ui, -apple-system, Roboto, sans-serif;
            display: flex;
            align-items: stretch;
            justify-content: center;
            background: transparent;
        }

        .menu-root {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .primary-cta {
            border: none;
            border-radius: 24px;
            padding: 18px 22px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #87997F;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
        }

        .primary-cta__icon {
            width: 28px;
            height: 28px;
            background-image: url("file:///android_res/drawable/vector_main_menu.png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
        }

        .primary-cta__text {
            letter-spacing: 0.01em;
        }

        .cards-grid {
            flex: 1;
            display: grid;
            /* два равных по ширине столбца */
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-auto-rows: minmax(80px, 1fr);
            gap: 16px;
        }

        .card {
            border-radius: 22px;
            border: none;
            padding: 16px;
            color: #fff;
            text-align: left;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* текст и иконки по верху карточек */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }

        .card__title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }



        .card--stolby {
            grid-row: 1 / span 2;
            grid-column: 1;
            padding: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.06), rgba(0, 0, 0, 0.4)), #607D8B;
            overflow: hidden;
        }

        .card--stolby-image {
            flex: 1;
            background-image: url("file:///android_res/drawable/abt_lenskie");
            background-size: cover;
            background-position: center;
            padding: 16px 20px;
            display: flex;
            align-items: flex-end;
        }

        .card--stolby-image span {
            font-size: 22px;
            font-weight: 600;
        }

        .card--checklist {
            grid-row: 1;
            grid-column: 2;
            background: #EAD3C5;
            color: #ffffff;
            align-items: flex-start;
            justify-content: flex-start; /* текст и иконка идут сверху по порядку */
        }

        .card--weather {
            grid-row: 2;
            grid-column: 2;
            background: #96C4D3;
            justify-content: space-between;
        }

        .weather-main {
            font-size: 28px;
            font-weight: 700;
        }

        .weather-dot {
            width: 32px;
            height: 32px;
            border-radius: 16px;
            background: #F6D89A;
            margin-top: 8px;
        }

        .card--audio {
            background: #B6B9A6;
            color: #ffffff;
            justify-content: flex-start; /* текст и иконка идут сверху по порядку */
        }

        .card--emergency {
            background: #D39696;
            color: #ffffff;
            justify-content: flex-start; /* текст и иконка идут сверху по порядку */
        }

        .card--trail {
            background: #D6B99B;
            justify-content: flex-start; /* текст и иконка идут сверху по порядку */
        }

        .card--other {
            background: #8A7562;
            justify-content: flex-start; /* текст и иконка идут сверху по порядку */
        }

        .card__icon {
            width: 42px;   /* немного крупнее иконки */
            height: 42px;
            margin-top: auto;           /* выталкиваем иконку к низу карточки */
            margin-bottom: 6px;
            align-self: flex-end;       /* прижимаем к правому краю */
            background-repeat: no-repeat;
            background-position: right bottom; /* снизу справа, как просил */
            background-size: contain;
        }

        .card__icon--check {
            background-image: url("file:///android_res/drawable/vector_check");
        }

        .card__icon--audio {
            background-image: url("file:///android_res/drawable/vector_audio");
        }

        .card__icon--route {
            background-image: url("file:///android_res/drawable/vector_route");
        }

        .card__icon--emergency {
            background-image: url("file:///android_res/drawable/vector_emergency");
        }

        .card__icon--language {
            background-image: url("file:///android_res/drawable/vector_language");
        }
    </style>
</head>
<body>
<div class="menu-root">
    <button class="primary-cta"
            onclick="window.AndroidMenu && AndroidMenu.openMap()">
        <span class="primary-cta__icon"></span>
        <span class="primary-cta__text">Построить маршрут</span>
    </button>

    <div class="cards-grid">
        <!-- О Столбах -->
        <button class="card card--stolby"
                onclick="window.AndroidMenu && AndroidMenu.openAbout()">
            <div class="card--stolby-image">
                <span>О Ленских Столбах</span>
            </div>
        </button>

        <!-- Чек‑лист -->
        <button class="card card--checklist"
                onclick="window.AndroidMenu && AndroidMenu.openChecklist()">
            <div>
                <div class="card__title">Чек‑лист</div>
            </div>
            <div class="card__icon card__icon--check"></div>
        </button>

        <!-- Погода -->
        <button class="card card--weather">
            <div class="weather-main">21°</div>
            <div class="weather-dot"></div>
        </button>

        <!-- Аудио экскурсии -->
        <button class="card card--audio"
                onclick="window.AndroidMenu && AndroidMenu.openMap()">
            <div>
                <div class="card__title">Аудио экскурсии</div>
            </div>
            <div class="card__icon card__icon--audio"></div>
        </button>

        <!-- Экстренные контакты -->
        <button class="card card--emergency">
            <div>
                <div class="card__title">Экстренные контакты</div>
            </div>
            <div class="card__icon card__icon--emergency"></div>
        </button>

        <!-- Тропа -->
        <button class="card card--trail">
            <div>
                <div class="card__title">Тропа</div>
            </div>
            <div class="card__icon card__icon--route"></div>
        </button>

        <!-- Остальное -->
        <button class="card card--other">
            <div>
                <div class="card__title">Остальное</div>
            </div>
            <div class="card__icon card__icon--language"></div>
        </button>
    </div>
</div>
</body>
</html>
