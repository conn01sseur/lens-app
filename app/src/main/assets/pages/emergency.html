<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Экстренные контакты</title>
  <style>
    :root {
      --bg: #c78f8f;
      --card: rgba(0, 0, 0, 0.16);
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 220ms ease, transform 220ms ease;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    body.loaded { opacity: 1; transform: translateY(0); }
    .tap { transition: transform 120ms ease, opacity 120ms ease; }
    .tap:active { transform: scale(0.98); opacity: 0.9; }
    .page {
      height: 100%;
      padding: 24px 18px;
    }
    .back {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      border: none;
      background: rgba(0, 0, 0, 0.12) url("../resources/back.png") center/14px no-repeat;
      margin-top: 34px;
    }
    h1 {
      margin-top: 18px;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
    }
    .actions {
      margin-top: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn {
      min-height: 0;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      border: none;
      background: var(--card);
      color: #fff;
      font-size: 17px;
      text-align: left;
      padding: 14px;
      display: flex;
      align-items: flex-end;
    }
    .btn:active {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="page">
    <button class="back tap" aria-label="Назад"
            onclick="window.AndroidEmergency && AndroidEmergency.goBack()"></button>
    <h1>Экстренные контакты</h1>

    <div class="actions">
      <button class="btn tap" disabled>Экстренные службы</button>
      <button class="btn tap" disabled>Службы парка</button>
    </div>
  </div>
  <script>
    window.addEventListener("load", () => {
      document.body.classList.add("loaded");
    });
  </script>
</body>
</html>
