<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ленские столбы</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: "Inter", "Segoe UI", Roboto, sans-serif;
      background: #d4ab87;
      color: #fff;
      overflow-y: auto;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 220ms ease, transform 220ms ease;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    body.loaded { opacity: 1; transform: translateY(0); }
    .tap { transition: transform 120ms ease, opacity 120ms ease; }
    .tap:active { transform: scale(0.98); opacity: 0.9; }
    .page {
      min-height: 100%;
      padding: 22px 18px 28px;
    }
    .back {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      border: none;
      background: rgba(0, 0, 0, 0.12) url("../resources/back.png") center/14px no-repeat;
      margin-top: 34px;
    }
    h1 {
      margin-top: 16px;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.15;
    }
    .photo {
      margin-top: 14px;
      width: 100%;
      display: block;
      border-radius: 14px;
      object-fit: cover;
    }
    .text-list {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .text-card {
      background: rgba(0, 0, 0, 0.12);
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 14.5px;
      line-height: 1.55;
      color: #f7f4f2;
      white-space: normal;
    }
  </style>
</head>
<body>
  <div class="page">
    <button class="back tap" aria-label="Назад"
            onclick="window.AndroidAbout && AndroidAbout.goBack()"></button>
    <h1>Ленские столбы</h1>
    <img class="photo" src="image-14.png" alt="Ленские столбы" />
    <div class="text-list">
      {{TEXT_BLOCKS}}
    </div>
  </div>
  <script>
    window.addEventListener("load", () => {
      document.body.classList.add("loaded");
    });
  </script>
</body>
</html>
